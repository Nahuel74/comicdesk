name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest --tb=short -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: comicdesk
            asset: comicdesk-linux
          - os: windows-latest
            artifact: comicdesk.exe
            asset: comicdesk-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller packaging/comicdesk.spec --clean --noconfirm
      - name: Verify binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f dist/comicdesk.exe
            echo "Binary size: $(du -h dist/comicdesk.exe | cut -f1)"
          else
            test -f dist/comicdesk
            echo "Binary size: $(du -h dist/comicdesk | cut -f1)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract release notes for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for [$VERSION]; using full CHANGELOG.md" >&2
            cp CHANGELOG.md release-notes.md
          fi
      - name: Package artifacts
        shell: bash
        run: |
          cd artifacts
          tar czf comicdesk-linux.tar.gz comicdesk-linux/
          mv comicdesk-windows.exe/comicdesk.exe ./comicdesk-windows.exe.tmp
          rm -rf comicdesk-linux/ comicdesk-windows.exe/
          mv comicdesk-windows.exe.tmp comicdesk-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/comicdesk-linux.tar.gz
            artifacts/comicdesk-windows.exe
